<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | GEOPORTAL CSN</title>
    <meta name="theme-color" content="#1a1a1a">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            width: 100%;
            height: 100vh;
            font-family: 'Inter', sans-serif;
            background-color: #f5f5f5;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            /* Fundo exato */
            background-image: url('public/fundo-premium-4k.jfif');
            background-size: 100% 100%; /* Força a imagem a mostrar tudo sem dar zoom ou cortar */
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
        }

        .login-wrapper {
            width: 100%;
            max-width: 387px; /* Diminuído em 12% (de 440px para 387px) */
            display: flex;
            flex-direction: column;
            align-items: center;
            /* Subir um pouco na tela para equilibrar com o footer */
            margin-top: -60px; /* Mais negativo para empurrar todo o bloco mais para cima */
        }

        .logo-container {
            display: flex;
            justify-content: center;
            /* Aumentei a margem para separar mais do painel e empurrar a logo para cima */
            margin-bottom: 50px; 
        }

        .logo-container img {
            height: 214px; /* Aumentado em 20% como solicitado (de 178 para 214) */
            width: auto;
            /* Filtros removidos para que a imagem apareça com o brilho e nitidez originais */
            transition: transform 0.3s ease;
        }

        .logo-container img:hover {
            transform: scale(1.03);
        }

        .login-card {
            width: 100%;
            /* Fundo simulando metal escovado/fosco - Um pouco mais claro que antes */
            background: linear-gradient(145deg, #383838 0%, #1c1c1c 100%);
            /* Borda sutil para dar o aspecto 3D da placa */
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 8px; /* Bordas um pouco menos arredondadas */
            padding: 55px 40px 40px 40px; /* Mais espaço interno, ajustado para o novo tamanho */
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.5), 0 0 100px rgba(0,0,0,0.2);
        }

        .login-header {
            text-align: center;
            margin-bottom: 35px;
        }

        .login-title {
            font-size: 15px;
            font-weight: 300;
            letter-spacing: 3px;
            color: #f0f0f0;
            text-transform: uppercase;
        }

        .login-subtitle {
            font-size: 10px;
            color: #d4af37; /* Dourado */
            font-weight: 500;
            letter-spacing: 2px;
            text-transform: uppercase;
            margin-top: 8px;
        }

        .form-group {
            margin-bottom: 20px;
            position: relative;
        }

        .form-group label {
            display: block;
            font-size: 10px;
            font-weight: 500;
            color: #888;
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .input-icon-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }

        .input-icon {
            position: absolute;
            left: 15px;
            color: #555;
            font-size: 12px;
            transition: color 0.3s;
        }

        .form-control {
            width: 100%;
            /* Inputs bem escuros igual na imagem */
            background: #111111;
            border: 1px solid rgba(255, 255, 255, 0.03);
            color: #e0e0e0;
            padding: 14px 14px 14px 45px;
            border-radius: 4px;
            font-size: 13px;
            font-family: inherit;
            transition: all 0.3s ease;
            box-shadow: inset 0 2px 5px rgba(0, 0, 0, 0.5);
        }

        .form-control::placeholder {
            color: #444;
        }

        .form-control:focus {
            outline: none;
            border-color: rgba(212, 175, 55, 0.4);
            box-shadow: inset 0 2px 5px rgba(0, 0, 0, 0.5), 0 0 10px rgba(212, 175, 55, 0.1);
        }

        .form-control:focus+.input-icon,
        .form-control:not(:placeholder-shown)+.input-icon {
            color: #d4af37;
        }

        .btn-login {
            width: 100%;
            background: transparent;
            border: 1px solid rgba(212, 175, 55, 0.3); /* Borda dourada mais fina e sutil */
            color: #d4af37; /* Texto dourado */
            padding: 13px;
            border-radius: 4px;
            font-size: 10px;
            font-weight: 500;
            letter-spacing: 2px;
            text-transform: uppercase;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin-top: 30px;
        }

        .btn-login:hover {
            background: rgba(212, 175, 55, 0.05);
            border-color: #e6c57a;
            color: #e6c57a;
            box-shadow: 0 0 15px rgba(212, 175, 55, 0.1);
        }

        .error-message {
            background: rgba(255, 51, 102, 0.1);
            border: 1px solid rgba(255, 51, 102, 0.2);
            color: #ff6b8b;
            padding: 12px;
            border-radius: 4px;
            font-size: 11px;
            text-align: center;
            margin-bottom: 20px;
            display: none;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .footer-text {
            text-align: center;
            margin-top: 40px;
            font-size: 9px;
            font-weight: 700;
            color: #7a7a7a; /* Cor acinzentada que mescla com o mármore */
            letter-spacing: 1.5px;
            white-space: nowrap;
            text-transform: uppercase;
        }
    </style>
</head>

<body>
    <div class="login-wrapper">
        
        <div class="logo-container">
            <img src="public/logo.png" alt="L6R Logo">
        </div>

        <div class="login-card">
            <div class="login-header">
                <div class="login-title">Acesso Restrito</div>
                <div class="login-subtitle"><i class="fa-solid fa-lock" style="font-size: 9px; margin-right: 5px;"></i>
                    Autenticação Necessária</div>
            </div>

            <div class="error-message" id="error-msg">
                <i class="fa-solid fa-circle-exclamation"></i>
                <span id="error-text">Usuário ou senha incorretos.</span>
            </div>

            <form id="login-form" onsubmit="event.preventDefault(); doLogin();">
                <div class="form-group">
                    <label for="username">Usuário</label>
                    <div class="input-icon-wrapper">
                        <input type="text" id="username" class="form-control" placeholder="Digite seu usuário" required
                            autocomplete="username">
                        <i class="fa-regular fa-user input-icon"></i>
                    </div>
                </div>

                <div class="form-group">
                    <label for="password">Senha</label>
                    <div class="input-icon-wrapper">
                        <input type="password" id="password" class="form-control" placeholder="Digite sua senha"
                            required autocomplete="current-password">
                        <i class="fa-solid fa-key input-icon"></i>
                    </div>
                </div>

                <button type="submit" class="btn-login" id="btn-submit">
                    <span>Entrar no Sistema</span>
                    <i class="fa-solid fa-arrow-right-to-bracket" style="font-size: 12px;"></i>
                </button>
            </form>
        </div>

        <div class="footer-text">
            &copy; 2026 GEOPORTAL CSN - MONITORAMENTO DE QUEIMADAS
        </div>
    </div>

    <script>
        // Forçar recarregamento se o usuário usar o botão "Voltar" do navegador
        window.addEventListener('pageshow', (event) => {
            if (event.persisted) {
                window.location.reload();
            }
        });

        async function doLogin() {
            const usernameInput = document.getElementById('username');
            const passwordInput = document.getElementById('password');
            const errorMsg = document.getElementById('error-msg');
            const errorText = document.getElementById('error-text');
            const btnSubmit = document.getElementById('btn-submit');

            const username = usernameInput.value;
            const password = passwordInput.value;

            // Reset error
            errorMsg.style.display = 'none';
            btnSubmit.disabled = true;
            btnSubmit.innerHTML = '<i class="fa-solid fa-circle-notch fa-spin"></i><span>Autenticando...</span>';

            try {
                const response = await fetch('api/login', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ username, password })
                });

                if (response.ok) {
                    btnSubmit.style.borderColor = '#cba34d';
                    btnSubmit.style.color = '#cba34d';
                    btnSubmit.innerHTML = '<i class="fa-solid fa-check"></i><span>Acesso Liberado</span>';

                    setTimeout(() => {
                        window.location.href = './';
                    }, 800);
                } else {
                    const data = await response.json().catch(() => ({}));
                    errorText.innerText = data.detail || 'Usuário ou senha incorretos.';
                    errorMsg.style.display = 'flex';
                    btnSubmit.disabled = false;
                    btnSubmit.innerHTML = '<span>Entrar no Sistema</span><i class="fa-solid fa-arrow-right-to-bracket"></i>';
                    passwordInput.value = '';
                    passwordInput.focus();
                }
            } catch (error) {
                errorText.innerText = 'Erro de conexão com o servidor.';
                errorMsg.style.display = 'flex';
                btnSubmit.disabled = false;
                btnSubmit.innerHTML = '<span>Entrar no Sistema</span><i class="fa-solid fa-arrow-right-to-bracket"></i>';
            }
        }
    </script>
</body>

</html>
