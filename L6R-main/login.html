<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | GEOPORTAL CSN</title>
    <meta name="theme-color" content="#030712">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #050505;
            --bg-card: rgba(15, 15, 15, 0.7);
            --border-color: rgba(212, 175, 55, 0.25);
            --border-glow: 0 0 15px rgba(212, 175, 55, 0.1);
            --accent-cyan: #00d4ff; 
            --accent-gold: #d4af37;
            --accent-red: #ff3366;
            --text-main: #f0f0f0; 
            --text-muted: #a0a0a0; 
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body { 
            width: 100%; 
            height: 100vh; 
            font-family: 'Inter', sans-serif; 
            background-color: var(--bg-dark); 
            color: var(--text-main); 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            overflow: hidden; 
            background-image: radial-gradient(circle at 50% 0%, #1a1a1a 0%, #000000 100%); 
        }

        /* Fundo com efeito visual */
        .background-effect {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            opacity: 0.15;
            background-image: 
                radial-gradient(circle at 15% 50%, rgba(212, 175, 55, 0.4) 0%, transparent 40%),
                radial-gradient(circle at 85% 30%, rgba(0, 212, 255, 0.4) 0%, transparent 40%);
            filter: blur(40px);
        }

        .login-wrapper {
            position: relative;
            z-index: 10;
            width: 100%;
            max-width: 420px;
            padding: 20px;
        }

        .brand-logo { 
            display: flex; 
            align-items: center; 
            justify-content: center;
            gap: 15px; 
            margin-bottom: 30px;
            filter: drop-shadow(0 0 8px rgba(255,255,255,0.2)); 
        }

        .login-card {
            background: var(--bg-card);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 40px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.5), var(--border-glow);
            transform: translateY(0);
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            animation: slideUp 0.8s ease-out forwards;
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .login-header {
            text-align: center;
            margin-bottom: 30px;
        }

        .login-title {
            font-size: 18px;
            font-weight: 300;
            letter-spacing: 2px;
            color: var(--text-main);
            text-transform: uppercase;
        }

        .login-subtitle {
            font-size: 11px;
            color: var(--accent-gold);
            font-weight: 400;
            letter-spacing: 3px;
            text-transform: uppercase;
            margin-top: 8px;
            opacity: 0.9;
        }

        .form-group {
            margin-bottom: 20px;
            position: relative;
        }

        .form-group label {
            display: block;
            font-size: 11px;
            font-weight: 500;
            color: var(--text-muted);
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .input-icon-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }

        .input-icon {
            position: absolute;
            left: 14px;
            color: var(--text-muted);
            font-size: 14px;
            transition: color 0.3s;
        }

        .form-control {
            width: 100%;
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: var(--text-main);
            padding: 12px 12px 12px 40px;
            border-radius: 6px;
            font-size: 14px;
            font-family: inherit;
            transition: all 0.3s ease;
            box-shadow: inset 0 2px 4px rgba(0,0,0,0.2);
        }

        .form-control:focus {
            outline: none;
            border-color: var(--accent-cyan);
            background: rgba(0, 0, 0, 0.6);
            box-shadow: inset 0 2px 4px rgba(0,0,0,0.2), 0 0 10px rgba(0, 212, 255, 0.15);
        }

        .form-control:focus + .input-icon, 
        .form-control:not(:placeholder-shown) + .input-icon {
            color: var(--accent-cyan);
        }

        .btn-login {
            width: 100%;
            background: transparent;
            border: 1px solid var(--accent-gold);
            color: var(--accent-gold);
            padding: 14px;
            border-radius: 6px;
            font-size: 13px;
            font-weight: 600;
            letter-spacing: 2px;
            text-transform: uppercase;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin-top: 30px;
        }

        .btn-login:hover {
            background: rgba(212,175,55,0.1);
            border-color: var(--accent-gold);
            color: #fff;
            box-shadow: 0 0 20px rgba(212,175,55,0.3);
            transform: translateY(-2px);
        }

        .btn-login:active {
            transform: translateY(0);
        }

        .error-message {
            background: rgba(255, 51, 102, 0.1);
            border: 1px solid rgba(255, 51, 102, 0.3);
            color: #ff809f;
            padding: 12px;
            border-radius: 6px;
            font-size: 12px;
            text-align: center;
            margin-bottom: 20px;
            display: none;
            align-items: center;
            justify-content: center;
            gap: 8px;
            animation: shake 0.5s ease-in-out;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            10%, 30%, 50%, 70%, 90% { transform: translateX(-5px); }
            20%, 40%, 60%, 80% { transform: translateX(5px); }
        }

        .footer-text {
            text-align: center;
            margin-top: 30px;
            font-size: 10px;
            color: var(--text-muted);
            letter-spacing: 1px;
            opacity: 0.6;
        }

        /* Adicionando ícone aos logos se não existirem as imagens, mas como existem, vamos usá-las */
        .logos-container img {
            height: 40px;
            width: auto;
            mix-blend-mode: screen;
        }
    </style>
</head>
<body>
    <div class="background-effect"></div>
    
    <div class="login-wrapper">
        <div class="brand-logo logos-container">
            <!-- Como as imagens estão na pasta public, o caminho deve ser relativo ao servidor que as serve -->
            <img src="public/l6r-logo.png" alt="L6R" onerror="this.style.display='none'">
            <img src="public/csn-logo.jpg" alt="CSN" onerror="this.style.display='none'">
        </div>

        <div class="login-card">
            <div class="login-header">
                <div class="login-title">Acesso Restrito</div>
                <div class="login-subtitle"><i class="fa-solid fa-lock" style="font-size: 9px; margin-right: 4px;"></i> Autenticação Necessária</div>
            </div>

            <div class="error-message" id="error-msg">
                <i class="fa-solid fa-circle-exclamation"></i>
                <span id="error-text">Usuário ou senha incorretos.</span>
            </div>

            <form id="login-form" onsubmit="event.preventDefault(); doLogin();">
                <div class="form-group">
                    <label for="username">Usuário</label>
                    <div class="input-icon-wrapper">
                        <input type="text" id="username" class="form-control" placeholder="Digite seu usuário" required autocomplete="username">
                        <i class="fa-regular fa-user input-icon"></i>
                    </div>
                </div>

                <div class="form-group">
                    <label for="password">Senha</label>
                    <div class="input-icon-wrapper">
                        <input type="password" id="password" class="form-control" placeholder="Digite sua senha" required autocomplete="current-password">
                        <i class="fa-solid fa-key input-icon"></i>
                    </div>
                </div>

                <button type="submit" class="btn-login" id="btn-submit">
                    <span>Entrar no Sistema</span>
                    <i class="fa-solid fa-arrow-right-to-bracket"></i>
                </button>
            </form>
        </div>

        <div class="footer-text">
            &copy; 2024 GEOPORTAL CSN • MONITORAMENTO DE QUEIMADAS
        </div>
    </div>

    <script>
        async function doLogin() {
            const usernameInput = document.getElementById('username');
            const passwordInput = document.getElementById('password');
            const errorMsg = document.getElementById('error-msg');
            const errorText = document.getElementById('error-text');
            const btnSubmit = document.getElementById('btn-submit');

            const username = usernameInput.value;
            const password = passwordInput.value;

            // Reset error
            errorMsg.style.display = 'none';
            btnSubmit.disabled = true;
            btnSubmit.innerHTML = '<i class="fa-solid fa-circle-notch fa-spin"></i><span>Autenticando...</span>';

            try {
                const response = await fetch('/api/login', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ username, password })
                });

                if (response.ok) {
                    // Login successful, animate and redirect
                    btnSubmit.style.borderColor = '#00ffcc';
                    btnSubmit.style.color = '#00ffcc';
                    btnSubmit.innerHTML = '<i class="fa-solid fa-check"></i><span>Acesso Liberado</span>';
                    
                    setTimeout(() => {
                        window.location.href = '/';
                    }, 800);
                } else {
                    const data = await response.json().catch(() => ({}));
                    errorText.innerText = data.detail || 'Usuário ou senha incorretos.';
                    errorMsg.style.display = 'flex';
                    // Re-trigger shake animation
                    errorMsg.style.animation = 'none';
                    errorMsg.offsetHeight; /* trigger reflow */
                    errorMsg.style.animation = null;
                    
                    btnSubmit.disabled = false;
                    btnSubmit.innerHTML = '<span>Entrar no Sistema</span><i class="fa-solid fa-arrow-right-to-bracket"></i>';
                    passwordInput.value = '';
                    passwordInput.focus();
                }
            } catch (error) {
                errorText.innerText = 'Erro de conexão com o servidor.';
                errorMsg.style.display = 'flex';
                btnSubmit.disabled = false;
                btnSubmit.innerHTML = '<span>Entrar no Sistema</span><i class="fa-solid fa-arrow-right-to-bracket"></i>';
            }
        }
    </script>
</body>
</html>
